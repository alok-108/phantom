name: automation-tests

# Unit tests for the scripts the repository automation runs (.github/scripts), against a mocked GitHub API.
on:
  push:
    branches: [main]
    paths: [".github/scripts/**", ".github/workflows/automation-tests.yml"]
  pull_request:
    paths: [".github/scripts/**", ".github/workflows/automation-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --test
        working-directory: .github/scripts
        run: node --test
