name: assign

# Lets a contributor claim an issue by commenting "/take" (or "I'll take this"),
# without waiting for a maintainer. It never checks out or runs contributor code.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  take:
    runs-on: ubuntu-latest
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      github.event.issue.state == 'open'
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const user = context.payload.comment.user.login;
            const body = context.payload.comment.body.trim();

            if (/^\/(release|unassign)\b/i.test(body)) {
              if (issue.assignees.some((a) => a.login === user)) {
                await github.rest.issues.removeAssignees({
                  owner, repo, issue_number: issue.number, assignees: [user],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Released, thanks for letting us know, @${user}. Anyone can pick this up with \`/take\`.`,
                });
              }
              return;
            }

            const wantsIt =/^(\/(take|assign)\b|i('| wi)?ll take (this|it)\b|i('d| would) (like|love) to (work on|take) (this|it)\b|can i (work on|take) (this|it)\b)/i;
            if (!wantsIt.test(body)) return;

            const say = (text) =>
              github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: text });
            const labels = issue.labels.map((l) => l.name);

            if (issue.assignees.length > 0) {
              const who = issue.assignees.map((a) => `@${a.login}`).join(', ');
              if (!issue.assignees.some((a) => a.login === user)) {
                await say(`Thanks for the interest, @${user}! This one is already taken by ${who}. Have a look at other issues labelled \`good first issue\` or \`help wanted\`.`);
              }
              return;
            }
            if (!labels.includes('help wanted') && !labels.includes('good first issue')) {
              await say(`Thanks, @${user}! This issue is not marked \`help wanted\` yet, so please wait for a maintainer to confirm before starting.`);
              return;
            }
            if (labels.includes('needs design')) {
              await say(`Thanks, @${user}! This one is labelled \`needs design\`: please propose your approach in a comment first and wait for a maintainer to agree before writing code. I am not assigning it automatically.`);
              return;
            }

            const MAX_OPEN = 2;
            const q = `repo:${owner}/${repo} is:issue is:open assignee:${user}`;
            const mine = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            if (mine.data.total_count >= MAX_OPEN) {
              await say(`Thanks, @${user}! You already have ${mine.data.total_count} open assigned issues. Please finish or release one first, so others get a chance too.`);
              return;
            }

            const res = await github.rest.issues.addAssignees({
              owner, repo, issue_number: issue.number, assignees: [user],
            });
            const assigned = res.data.assignees.some((a) => a.login === user);
            if (!assigned) {
              await say(`Thanks, @${user}! GitHub would not let me assign this to you automatically; a maintainer will do it. Feel free to start meanwhile.`);
              return;
            }
            await say(`Assigned to you, @${user}. Have fun! The [Contributor Guide](https://github.com/${owner}/${repo}/blob/main/docs/CONTRIBUTOR_GUIDE.md) has the setup steps. If you get stuck, ask here. If you cannot finish, just comment \`/release\` so someone else can pick it up. Inactive claims are released automatically after about three weeks.`);
