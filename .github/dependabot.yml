version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Only raise a minimum version in pyproject.toml when the current range no longer allows
    # the latest release, so contributors are not forced onto the newest tools.
    versioning-strategy: increase-if-necessary
