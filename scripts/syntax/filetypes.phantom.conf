# Geany filetype definition for Phantom-annotated Python files.
#
# Install as filetypes.phantom.conf in Geany's filedefs directory.
# The Python lexer is reused because Phantom instructions live in Python
# comments and the host program remains ordinary Python.
#
# Geany's built-in Python lexer styles an entire comment as one token. Its
# filetype configuration cannot independently recolor instruction names or
# marker substrings inside that comment; those lines therefore use the
# configured comment style. The keyword list also exposes the Phantom
# instruction names to the Python lexer wherever it can tokenize them.

[styling=Python]

[keywords]
primary= False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield event.declare event.on diagnostic.note diagnostic.warn counter.create counter.increment counter.decrement counter.reset meta.author meta.version meta.license meta.tags

[settings]
lexer_filetype=Python
extension=py
comment_single=#
comment_use_indent=true
