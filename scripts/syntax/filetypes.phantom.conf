# Geany custom filetype for Phantom's instruction layer in Python source.
# Install as ~/.config/geany/filedefs/filetypes.Phantom.conf, then select
# Document > Set Filetype > Phantom for a .py file (or add a Phantom mapping
# to filetype_extensions.conf if you use a dedicated extension).
# The Python lexer styles comments as a whole; Phantom markers therefore use
# the Python comment style while instruction words are added to its keyword lists.

[styling]
default=default
commentline=comment_line
number=number_1
string=string_1
character=character
word=keyword_1
triple=string_2
tripledouble=string_2
classname=type
defname=function
operator=operator
identifier=identifier_1
commentblock=comment
stringeol=string_eol
word2=keyword_2
decorator=decorator
fstring=string_1
fcharacter=character
ftriple=string_2
ftripledouble=string_2
attribute=identifier_1

[keywords]
# Keep Python's built-in keyword and identifier lists, then add Phantom terms.
# Geany/Scintilla requires each keyword list to stay on one line.
primary=False None True _ and as assert async await break case class continue def del elif else except finally for from global if import in is lambda match nonlocal not or pass raise return try while with yield
identifiers=ArithmeticError AssertionError AttributeError BaseException BlockingIOError BrokenPipeError BufferError BytesWarning ChildProcessError ConnectionAbortedError ConnectionError ConnectionRefusedError ConnectionResetError DeprecationWarning EOFError Ellipsis EncodingWarning EnvironmentError Exception FileExistsError FileNotFoundError FloatingPointError FutureWarning GeneratorExit IOError ImportError ImportWarning IndentationError IndexError InterruptedError IsADirectoryError KeyError KeyboardInterrupt LookupError MemoryError ModuleNotFoundError NameError NotADirectoryError NotImplemented NotImplementedError OSError OverflowError PendingDeprecationWarning PermissionError ProcessLookupError RecursionError ReferenceError ResourceWarning RuntimeError RuntimeWarning StopAsyncIteration StopIteration SyntaxError SyntaxWarning SystemError SystemExit TabError TimeoutError TypeError UnboundLocalError UnicodeDecodeError UnicodeEncodeError UnicodeError UnicodeTranslateError UnicodeWarning UserWarning ValueError Warning ZeroDivisionError __build_class__ __debug__ __doc__ __import__ __loader__ __name__ __package__ __spec__ abs aiter all anext any ascii bin bool breakpoint bytearray bytes callable chr classmethod compile complex copyright credits delattr dict dir divmod enumerate eval exec exit filter float format frozenset getattr globals hasattr hash help hex id input int isinstance issubclass iter len license list locals map max memoryview min next object oct open ord pow print property quit range repr reversed round set setattr slice sorted staticmethod str sum super tuple type vars zip event declare on diagnostic note warn counter create increment decrement reset meta author version license tags phantom hybrid ws begin end zw

[settings]
lexer_filetype=Python
tag_parser=Python
extension=py
comment_single=#
comment_use_indent=true
