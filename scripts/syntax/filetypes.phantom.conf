# Geany filetype association for Phantom-annotated Python files.
#
# Install as filetypes.phantom.conf in Geany's filedefs directory.
# This reuses Geany's built-in Python lexer because Phantom instructions
# are embedded in Python comments and the host program remains Python.
#
# Limitation: the built-in Python lexer styles each comment as one token.
# A filetype configuration cannot separately highlight instruction names
# such as event.declare or counter.create inside '#:' comment lines.
# The Python lexer therefore displays those lines using its normal comment
# style. Distinct instruction-layer highlighting would require a custom
# lexer or editor plugin, not this configuration.

[styling=Python]

[settings]
lexer_filetype=Python
extension=py
comment_single=#
comment_use_indent=true
